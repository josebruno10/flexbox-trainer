# Aberto pelo comando "FlexBox Trainer: Relatar Problema", que já preenche a
# versão, o VS Code, o sistema e o código do desafio (pelos ids dos campos).
name: Relatar problema
description: Algo deu errado no FlexBox Trainer.
title: "Problema: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por avisar! Quanto mais detalhes, mais rápido dá para resolver.
        Este relato fica público: não escreva senhas, tokens nem dados pessoais.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: O que você esperava e o que aconteceu no lugar.
    validations:
      required: true
  - type: textarea
    id: o-que-fazia
    attributes:
      label: O que você estava fazendo?
      description: Os passos até o problema, por exemplo "gerei um desafio no fácil e cliquei em Verificar".
  - type: textarea
    id: mensagem
    attributes:
      label: Mensagem de erro
      description: Se apareceu alguma, copie exatamente como está. Dá para anexar um print da barra lateral aqui.
  - type: input
    id: codigo
    attributes:
      label: Código do desafio
      description: Aparece nos dados do desafio, na barra lateral.
  - type: input
    id: versao
    attributes:
      label: Versão do FlexBox Trainer
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: Versão do VS Code
  - type: input
    id: sistema
    attributes:
      label: Sistema
