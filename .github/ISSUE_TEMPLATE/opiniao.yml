# Aberto pelo comando "FlexBox Trainer: Dar Opinião". As 10 primeiras
# perguntas são o SUS (System Usability Scale); scripts/opinioes.mjs junta
# as respostas e calcula a nota. Não mude o texto nem a ordem delas.
name: Dar opinião
description: Dez perguntas rápidas sobre usar o FlexBox Trainer.
title: "Opinião sobre o FlexBox Trainer"
labels: ["opinião"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por testar! Responda pensando no seu uso da extensão: 1 é "discordo totalmente" e 5 é "concordo totalmente".
        As respostas ficam públicas no GitHub: não escreva dados pessoais.
  - type: dropdown
    id: sus-1
    attributes:
      label: "1. Eu acho que gostaria de usar esta extensão com frequência."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-2
    attributes:
      label: "2. Eu acho a extensão desnecessariamente complexa."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-3
    attributes:
      label: "3. Eu achei a extensão fácil de usar."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-4
    attributes:
      label: "4. Eu acho que precisaria da ajuda de uma pessoa com conhecimentos técnicos para usar a extensão."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-5
    attributes:
      label: "5. Eu acho que as várias funções da extensão estão muito bem integradas."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-6
    attributes:
      label: "6. Eu acho que a extensão apresenta muita inconsistência."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-7
    attributes:
      label: "7. Eu imagino que as pessoas aprenderão a usar esta extensão rapidamente."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-8
    attributes:
      label: "8. Eu achei a extensão atrapalhada de usar."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-9
    attributes:
      label: "9. Eu me senti confiante ao usar a extensão."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: dropdown
    id: sus-10
    attributes:
      label: "10. Eu precisei aprender várias coisas novas antes de conseguir usar a extensão."
      options:
        - "1 · Discordo totalmente"
        - "2"
        - "3"
        - "4"
        - "5 · Concordo totalmente"
    validations:
      required: true
  - type: textarea
    id: gostou
    attributes:
      label: O que você mais gostou?
  - type: textarea
    id: faltou
    attributes:
      label: O que mais atrapalhou ou faltou?
  - type: dropdown
    id: torneio
    attributes:
      label: Você já participou do Frontend Teams Cup?
      options:
        - "Sim"
        - "Não"
  - type: input
    id: versao
    attributes:
      label: Versão do FlexBox Trainer
