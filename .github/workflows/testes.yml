# A cada envio ao main (e em pull requests), confere tipos e estilo, roda a
# suíte no VS Code para navegador e no desktop, e guarda o .vsix gerado.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    # Versão fixa: o ubuntu-latest passa a ser o Ubuntu 26 em 19/10/2026, e
    # essa troca não deve quebrar os testes de surpresa.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A extensão fica em extensao/; os comandos rodam lá.
    defaults:
      run:
        working-directory: extensao
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensao/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Tipos e estilo
        run: |
          npm run typecheck
          npm run lint

      - name: Navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes no VS Code para navegador
        run: xvfb-run -a npm test

      - name: Testes no VS Code desktop
        run: xvfb-run -a npm run test:desktop

      - name: Gerar o .vsix
        run: npm run vsix

      # Para testar uma mudança antes da versão: baixe em Actions → esta
      # execução → Artifacts.
      - uses: actions/upload-artifact@v7
        with:
          name: flexbox-trainer-vsix
          path: extensao/*.vsix
          retention-days: 30
