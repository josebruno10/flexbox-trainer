# A cada envio ao main (e em pull requests), confere tipos e estilo, roda a
# suíte no VS Code para navegador e no desktop, e guarda o .vsix gerado.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos e estilo
        run: |
          npm run typecheck
          npm run lint

      - name: Navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes no VS Code para navegador
        run: xvfb-run -a npm test

      - name: Testes no VS Code desktop
        run: xvfb-run -a npm run test:desktop

      - name: Gerar o .vsix
        run: npx --yes @vscode/vsce@3 package

      # Para testar uma mudança antes da versão: baixe em Actions → esta
      # execução → Artifacts.
      - uses: actions/upload-artifact@v7
        with:
          name: flexbox-trainer-vsix
          path: "*.vsix"
          retention-days: 30
