# Quando uma versão é publicada em Releases, roda os testes no código da
# etiqueta, anexa o .vsix gerado aqui (substituindo um anexado à mão) e
# confere de ponta a ponta que a versão anterior se atualiza para ela.
name: Versão

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  vsix:
    # Versão fixa: o ubuntu-latest passa a ser o Ubuntu 26 em 19/10/2026, e
    # essa troca não deve quebrar os testes de surpresa.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ETIQUETA: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Conferir a versão
        run: |
          versao="$(node -p "require('./package.json').version")"
          if [ "v$versao" != "$ETIQUETA" ]; then
            echo "A etiqueta $ETIQUETA não bate com a versão $versao do package.json." >&2
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes
        run: |
          xvfb-run -a npm test
          xvfb-run -a npm run test:desktop

      - name: Gerar e anexar o .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes @vscode/vsce@3 package
          gh release upload "$ETIQUETA" flexbox-trainer-*.vsix --clobber

  ponta-a-ponta:
    # Com o .vsix já anexado, a versão anterior, instalada num VS Code limpo,
    # precisa achar esta, se atualizar com um clique e mostrar o que mudou.
    # Uma pré-versão não é a "latest" do GitHub, que o aviso consulta.
    needs: vsix
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ETIQUETA: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Baixar a versão anterior
        run: |
          anterior="$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 10 --json tagName --jq "[.[].tagName | select(. != \"$ETIQUETA\")][0]")"
          echo "Versão anterior: $anterior"
          gh release download "$anterior" --pattern '*.vsix' --dir anterior

      - name: Atualizar de ponta a ponta
        # O contexto runner só existe dentro dos passos.
        env:
          E2E_PASTA: ${{ runner.temp }}/ponta-a-ponta
        run: xvfb-run -a npm run test:e2e -- anterior/*.vsix "${ETIQUETA#v}"

      - name: Fotos da falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ponta-a-ponta
          path: ${{ runner.temp }}/ponta-a-ponta/*.png
          retention-days: 30
