<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Login Google | FlexBox Trainer</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="layout">
    <section class="hero">
      <p class="eyebrow">FlexBox Trainer</p>
      <h1>Entre com o Google</h1>
      <p class="lead">
        A extensão usa o Google somente para identificar sua conta. Depois, a API
        gera um token próprio para acessar as rotas protegidas.
      </p>
      <div class="chips">
        <span>Google Identity Services</span>
        <span>Token da API</span>
        <span>Retorno seguro ao VS Code</span>
      </div>
    </section>

    <section class="panel">
      <div class="notice" id="notice">Preparando o login...</div>
      <div id="googleButton" class="google-button" aria-label="Entrar com Google"></div>
      <div class="status" id="status">Carregando o autenticador do Google...</div>
    </section>
  </main>

  <script src="./app.js?v=2"></script>
</body>
</html>
